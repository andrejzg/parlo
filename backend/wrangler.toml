name = "parlo-backend"
main = "src/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

routes = [
  { pattern = "api.parlo.me", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "parlo"
database_id = "e7917315-4d35-459a-9a01-1dee0a00b258"

[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "parlo-audio"

[[kv_namespaces]]
binding = "KV"
id = "0ed2107abd454e33918ac4717f2f7a33"

[ai]
binding = "AI"

# One GroupAgent Durable Object per parlo (instance name = survey id). Its
# private SQLite is the agent's "file system"; D1 stays the system of record.
[[durable_objects.bindings]]
name = "GROUP_AGENT"
class_name = "GroupAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GroupAgent"]

[vars]
WHATSAPP_VERIFY_TOKEN = "REPLACE_WITH_VERIFY_TOKEN"
# Firebase project whose ID tokens prove a phone (public; it is in the frontend bundle too).
FIREBASE_PROJECT_ID = "parlo-ad2cb"
# Public origins, used for OAuth callback URLs and redirects. Override in .dev.vars locally.
API_ORIGIN = "https://api.parlo.me"
FRONTEND_ORIGIN = "https://parlo.me"
