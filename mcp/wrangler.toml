name = "parlo-mcp"
main = "src/index.ts"
workers_dev = true
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "mcp.parlo.me/*", zone_name = "parlo.me" }
]

[[migrations]]
tag = "v2"
deleted_classes = ["ParloMcpAgent"]

[[services]]
binding = "PARLO_BACKEND"
service = "parlo-backend"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "0797bc38784d4a77b5a1d1edef68571b"

[vars]
PARLO_BACKEND_URL = "https://api.parlo.me"
