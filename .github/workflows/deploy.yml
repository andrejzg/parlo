name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Deploy backend worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      # Re-assert Worker secrets on every deploy. Source of truth lives in
      # GitHub Actions secrets (encrypted at rest). Skips empty secrets to
      # avoid clearing values on the Worker when a GH secret hasn't been set.
      #
      # This runs BEFORE `wrangler deploy` on purpose. `wrangler secret bulk`
      # PATCHes the Worker settings and "inherits" the non-secret bindings it
      # reads back; on 2026-10-09 that read raced the deploy that had just
      # finished and the PATCH wiped D1/R2/KV/AI, taking production down.
      # Deploying last means the bindings in wrangler.toml always win, and
      # `wrangler deploy` keeps existing secrets.
      - name: Sync Worker secrets
        working-directory: backend
        run: |
          node -e '
            const fs = require("fs");
            const e = process.env;
            const keys = [
              "LINKEDIN_CLIENT_ID",
              "LINKEDIN_CLIENT_SECRET",
              "KAPSO_API_KEY",
              "WHATSAPP_PHONE_NUMBER_ID",
              "POSTHOG_API_KEY",
              "KAPSO_WEBHOOK_SECRET",
              "CEREBRAS_API_KEY",
              "TYPESAFE_API_KEY"
            ];
            const out = {};
            for (const k of keys) if (e[k]) out[k] = e[k];
            if (Object.keys(out).length === 0) {
              console.log("No secrets to sync");
              process.exit(0);
            }
            fs.writeFileSync("/tmp/parlo-secrets.json", JSON.stringify(out));
            console.log("Synced keys: " + Object.keys(out).join(", "));
          '
          if [ -f /tmp/parlo-secrets.json ]; then
            npx wrangler secret bulk /tmp/parlo-secrets.json --config ./wrangler.toml --name parlo-backend
            rm /tmp/parlo-secrets.json
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          KAPSO_WEBHOOK_SECRET: ${{ secrets.KAPSO_WEBHOOK_SECRET }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      - name: Deploy
        working-directory: backend
        run: npx wrangler deploy --config ./wrangler.toml --name parlo-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Belt and braces: fail loudly if the live Worker is missing any of the
      # resource bindings from wrangler.toml, so a broken deploy can't go
      # unnoticed until someone taps "Create voice agent".
      - name: Verify Worker bindings
        run: |
          node -e '
            const required = ["DB", "AUDIO_BUCKET", "KV", "AI"];
            const url = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/parlo-backend/settings`;
            fetch(url, { headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } })
              .then((r) => r.json())
              .then((j) => {
                const names = new Set((j.result?.bindings ?? []).map((b) => b.name));
                const missing = required.filter((n) => !names.has(n));
                if (missing.length) {
                  console.error("Live Worker is missing bindings: " + missing.join(", "));
                  process.exit(1);
                }
                console.log("Live Worker bindings OK: " + [...names].join(", "));
              });
          '
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  mcp:
    name: Deploy MCP worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install
        working-directory: mcp
        run: npm ci
      - name: Deploy
        working-directory: mcp
        run: npx wrangler deploy --config ./wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  frontend:
    name: Deploy frontend to Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npx vite build
      - name: Deploy
        working-directory: frontend
        run: npx wrangler pages deploy dist --project-name parlo --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
